[global_tags]
  edge_gateway_id = "gateway-dc1-alpha"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  omit_hostname = false

# ----------------------------------------------------
# DUMMY INPUT TO PREVENT STARTUP CRASH
# ----------------------------------------------------
[[inputs.internal]]
  # Set to false to reduce noise, it just needs to exist
  collect_memstats = false 
# ----------------------------------------------------

# For local PoC testing before Kafka is ready
[[outputs.file]]
  files = ["stdout"]
  data_format = "json"

